<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Emperors · Map study</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="heading">
    <div><p class="eyebrow" id="view-meta">PERSEUS ARM · SECTOR 07</p><h1 id="view-title">The frontier</h1></div>
    <div class="resources"><span id="minerals">💠 1 240</span><span id="gas">🔥 610</span></div>
  </header>
  <nav class="view-switcher" aria-label="Map study">
    <button type="button" data-view="galaxy">Galaxy</button>
    <button type="button" data-view="young">First colonies <small>4 planets</small></button>
    <button type="button" data-view="developed">High empire <small>8 planets</small></button>
  </nav>
  <main id="map-panel">
    <svg id="galaxy" aria-label="Space map. Drag to pan, pinch or use controls to zoom.">
      <defs>
        <radialGradient id="sun-halo"><stop stop-color="#ffbe63" stop-opacity=".55"/><stop offset=".3" stop-color="#ef8833" stop-opacity=".16"/><stop offset="1" stop-color="#e88739" stop-opacity="0"/></radialGradient>
        <radialGradient id="sun"><stop stop-color="#fff0bd"/><stop offset=".55" stop-color="#ffd475"/><stop offset=".9" stop-color="#e98738"/><stop offset="1" stop-color="#ffcb79"/></radialGradient>
        <radialGradient id="terminator" cx="27%" cy="24%" r="80%"><stop stop-color="#cdeaff" stop-opacity=".18"/><stop offset=".42" stop-color="#0a1020" stop-opacity="0"/><stop offset=".8" stop-color="#070c18" stop-opacity=".6"/><stop offset="1" stop-color="#070c18" stop-opacity=".98"/></radialGradient>
        <radialGradient id="nebula-blue"><stop stop-color="#476b9b" stop-opacity=".42"/><stop offset=".5" stop-color="#354671" stop-opacity=".15"/><stop offset="1" stop-color="#202c52" stop-opacity="0"/></radialGradient>
        <radialGradient id="nebula-rose"><stop stop-color="#985a79" stop-opacity=".27"/><stop offset=".55" stop-color="#694368" stop-opacity=".12"/><stop offset="1" stop-color="#452e52" stop-opacity="0"/></radialGradient>
        <filter id="dust" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".009 .014" numOctaves="3" seed="28"/><feColorMatrix type="saturate" values="0"/><feComposite in="SourceGraphic" operator="in"/></filter>
        <filter id="glow"><feGaussianBlur stdDeviation="2"/></filter>
        <symbol id="ship-sprite" viewBox="-12 -8 24 16"><path d="M-7,-2 L-15,0 L-7,2" fill="#91def3" opacity=".8"/><path d="M10,0 -7,-5 -4,0 -7,5Z" fill="#d9e6e7" stroke="#557284" stroke-width=".8"/><path d="M2,0 -5,-2 -4,2Z" fill="#648796"/></symbol>
        <symbol id="freighter-sprite" viewBox="-12 -8 24 16"><path d="M-8,-2 -17,0 -8,2" fill="#9ce7ff" opacity=".7"/><path d="M9,0 3,-4 -9,-4 -9,4 3,4Z" fill="#c7cbd0" stroke="#5f7987"/><path d="M-6,-4V4 M-2,-4V4 M2,-3V3" stroke="#d2aa65" stroke-width="2"/></symbol>
      </defs>
      <g id="backdrop"></g>
      <g id="world"><g id="cells"></g><g id="orbits"></g><g id="routes"></g><g id="stars"></g><g id="planets"></g><g id="ships"></g></g>
    </svg>
    <div class="map-caption"><span class="live-dot"></span><span id="flight-summary"></span></div>
    <div class="map-mode" id="map-mode">HEX SECTORS</div>
    <button type="button" id="overview" hidden>Overview ↗</button>
    <fieldset class="zoom" aria-label="Map controls">
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" id="recenter" aria-label="Return to home planet">⌖</button>
    </fieldset>
    <p class="drag-hint" id="drag-hint">Drag to explore · tap a star</p>
  </main>
  <section class="orbit-picker" id="orbit-picker" aria-label="Select an orbit" hidden></section>
  <section class="selection" aria-live="polite">
    <div class="selection-head"><div><p id="planet-meta" class="eyebrow"></p><h2 id="planet-name">Solara</h2></div><span id="planet-biome"></span></div>
    <div class="selection-footer"><span id="planet-detail"></span><button type="button" id="planet-action">Enter system ↗</button></div>
  </section>
  <footer><span id="scene-note">MAP STUDY · SAMPLE STATE</span><span class="ownership-key"><i></i> Your colonies</span></footer>
  <div id="status" role="status"></div>
</body>
</html>
